name: Refresh model catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate catalog from latest pi-ai
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-ai@latest
          node scripts/generate-model-catalog.mjs
          npx vitest run --root . apps/desktop/src/main/agent/model-catalog-service.test.ts
      - name: Publish catalog update
        run: |
          branch=automation/model-catalog
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add catalog/models.json
          git diff --cached --quiet || git commit -m "chore(models): refresh runtime catalog"
          git push --force-with-lease origin "HEAD:$branch"
